<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.s{font-family:-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
.m{font-family:'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace}
.c{opacity:0;transform:translateY(12px);animation:f .8s ease forwards}.d2{animation-delay:.2s}.d3{animation-delay:.4s}
@keyframes f{to{opacity:1;transform:none}}
.l{font-size:13px;letter-spacing:2px;fill:#5b636d}
.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.25}}
</style>
<g class="c"><rect x="1" y="1" width="538" height="238" rx="18" fill="#0f1216" stroke="#1f242b"/>
<text class="m l" x="32" y="48">ABOUT</text>
<g class="s" font-size="27"><text x="32" y="105" fill="#e6edf3">Programmer from Tehran,</text><text x="32" y="143" fill="#7d8590">building fast, clean and modern</text><text x="32" y="181" fill="#7d8590">web applications.</text></g></g>
<g transform="translate(556 0)"><g class="c d2"><rect x="1" y="1" width="328" height="238" rx="18" fill="#0f1216" stroke="#1f242b"/>
<text class="m l" x="32" y="48">FOCUS</text>
<g fill="#3a4049"><rect x="32" y="92" width="8" height="8" rx="2"/><rect x="32" y="132" width="8" height="8" rx="2"/><rect x="32" y="172" width="8" height="8" rx="2"/></g>
<g class="s" font-size="21" fill="#c9d1d9"><text x="56" y="101">Web development</text><text x="56" y="141">Clean UI &amp; UX</text><text x="56" y="181">Backend &amp; APIs</text></g></g></g>
<g transform="translate(902 0)"><g class="c d3"><rect x="1" y="1" width="296" height="238" rx="18" fill="#0f1216" stroke="#1f242b"/>
<text class="m l" x="32" y="48">STATUS</text>
<circle class="pu" cx="38" cy="96" r="5" fill="#3fb950"/>
<text class="s" x="56" y="102" font-size="21" fill="#c9d1d9">Learning &amp; building</text>
<g class="s" font-size="18" fill="#7d8590"><text x="32" y="145">Now: TypeScript</text><text x="32" y="177">Next: System design</text></g>
<text class="m" x="32" y="215" font-size="13" fill="#5b636d">Tehran, IR</text></g></g>
</svg>
