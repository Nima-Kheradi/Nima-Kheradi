<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0d14"/><stop offset=".5" stop-color="#0f1a3a"/><stop offset="1" stop-color="#1c0f3a"/></linearGradient>
<linearGradient id="tx" x1="0" x2="1"><stop offset="0" stop-color="#00f0ff"><animate attributeName="stop-color" values="#00f0ff;#b26bff;#ff4fd8;#00f0ff" dur="6s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#ff4fd8"><animate attributeName="stop-color" values="#ff4fd8;#00f0ff;#b26bff;#ff4fd8" dur="6s" repeatCount="indefinite"/></stop></linearGradient>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#00f0ff" stroke-opacity=".09"/></pattern>
<clipPath id="c"><rect width="1200" height="340" rx="20"/></clipPath>
</defs>
<style>
.m{font-family:'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace}
.sub{opacity:0;animation:cy 12s infinite}
.s2{animation-delay:3s}.s3{animation-delay:6s}.s4{animation-delay:9s}
@keyframes cy{0%{opacity:0;transform:translateY(8px)}4%,22%{opacity:1;transform:none}26%,100%{opacity:0}}
.fl{animation:fl 5s ease-in-out infinite alternate}.f2{animation-duration:7s}.f3{animation-duration:9s}
@keyframes fl{to{transform:translateY(-18px)}}
.scan{animation:sc 5s linear infinite}
@keyframes sc{from{transform:translateY(-80px)}to{transform:translateY(340px)}}
.blink{animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
</style>
<g clip-path="url(#c)">
<rect width="1200" height="340" fill="url(#bg)"/>
<rect width="1200" height="340" fill="url(#grid)"/>
<rect class="scan" width="1200" height="70" fill="#00f0ff" opacity=".06"/>
<circle class="fl" cx="120" cy="250" r="3" fill="#00f0ff"/><circle class="fl f2" cx="300" cy="90" r="2" fill="#ff4fd8"/>
<circle class="fl f3" cx="900" cy="280" r="3" fill="#b26bff"/><circle class="fl f2" cx="1080" cy="80" r="3" fill="#00f0ff"/>
<circle class="fl" cx="760" cy="60" r="2" fill="#ff4fd8"/><circle class="fl f3" cx="60" cy="130" r="2" fill="#b26bff"/>
</g>
<g fill="none" stroke="#00f0ff" stroke-width="3" opacity=".8"><path d="M24 70V24H70"/><path d="M1176 70V24H1130"/><path d="M24 270v46h46"/><path d="M1176 270v46h-46"/></g>
<text class="m" x="50" y="62" font-size="15" fill="#00f0ff" opacity=".8">nima@tehran:~$ <tspan class="blink">_</tspan></text>
<text class="m" x="1150" y="62" font-size="15" fill="#ff4fd8" opacity=".8" text-anchor="end">[ ONLINE ]</text>
<text class="m" x="600" y="170" font-size="86" font-weight="800" text-anchor="middle" fill="url(#tx)" filter="url(#glow)">NIMA KHERADI</text>
<text class="m" x="600" y="212" font-size="19" text-anchor="middle" fill="#8b949e" letter-spacing="7">PROGRAMMER · WEB DEVELOPER</text>
<g class="m" font-size="25" text-anchor="middle" fill="#e6edf3">
<text class="sub" x="600" y="274"><tspan fill="#00f0ff">&gt;</tspan> building things for the web</text>
<text class="sub s2" x="600" y="274"><tspan fill="#b26bff">&gt;</tspan> breaking stuff to learn how it works</text>
<text class="sub s3" x="600" y="274"><tspan fill="#ff4fd8">&gt;</tspan> always learning, one bug at a time</text>
<text class="sub s4" x="600" y="274"><tspan fill="#00f0ff">&gt;</tspan> let's build something cool together</text>
</g>
</svg>
