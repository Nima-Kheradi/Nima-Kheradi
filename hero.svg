<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="n" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#8b949e"/></linearGradient>
<radialGradient id="gl" cx=".5" cy="0" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect x="1" y="1" width="1198" height="358" rx="22"/></clipPath>
</defs>
<style>
.s{font-family:-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
.m{font-family:'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace}
.w{opacity:0;animation:w 9s infinite}.w2{animation-delay:3s}.w3{animation-delay:6s}
@keyframes w{0%{opacity:0;transform:translateY(6px)}5%,28%{opacity:1;transform:none}33%,100%{opacity:0}}
.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.25}}
.br{animation:br 6s ease-in-out infinite}@keyframes br{50%{opacity:.4}}
</style>
<rect x="1" y="1" width="1198" height="358" rx="22" fill="#0a0a0a" stroke="#1f242b"/>
<g clip-path="url(#c)">
<rect class="br" width="1200" height="360" fill="url(#gl)"/>
<rect y="1" width="320" height="1" fill="url(#hl)"><animateTransform attributeName="transform" type="translate" values="-320 0;1200 0" dur="7s" repeatCount="indefinite"/></rect>
</g>
<rect x="70" y="42" width="196" height="32" rx="16" fill="#0f1216" stroke="#2a2f37"/>
<circle class="pu" cx="91" cy="58" r="4" fill="#3fb950"/>
<text class="s" x="105" y="63" font-size="14" fill="#9aa4af">Open to collaborate</text>
<text class="s" x="66" y="188" font-size="96" font-weight="700" letter-spacing="-3" fill="url(#n)">Nima Kheradi</text>
<g class="m" font-size="26">
<text x="70" y="245" fill="#7d8590">I build</text>
<text class="w" x="70" y="245" fill="#e6edf3" dx="125">for the web.</text>
<text class="w w2" x="70" y="245" fill="#e6edf3" dx="125">clean interfaces.</text>
<text class="w w3" x="70" y="245" fill="#e6edf3" dx="125">fast backends.</text>
</g>
<g transform="translate(985 165)" fill="none" stroke="#1f242b">
<circle r="150"/><circle r="105"/><circle r="64" stroke="#2a2f37"/>
<g><circle cx="105" r="5" fill="#fff" stroke="none"/><animateTransform attributeName="transform" type="rotate" values="0;360" dur="24s" repeatCount="indefinite"/></g>
<g><circle cx="150" r="3" fill="#7d8590" stroke="none"/><animateTransform attributeName="transform" type="rotate" values="360;0" dur="40s" repeatCount="indefinite"/></g>
<circle r="44" fill="#0f1216" stroke="#2a2f37"/>
<text class="s" y="16" font-size="40" font-weight="700" text-anchor="middle" fill="url(#n)" stroke="none">NK</text>
</g>
<rect x="70" y="300" width="1060" height="1" fill="#1f242b"/>
<g class="m" font-size="14" fill="#5b636d"><text x="70" y="334">Tehran, IR</text><text x="600" y="334" text-anchor="middle">nimakheradi.ir</text><text x="1130" y="334" text-anchor="end">Programmer</text></g>
</svg>
